name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/lexicon
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: linguatrack-lexicon build --lock examples/synthetic.lock.json --out data/ci-a --distribution
      - run: linguatrack-lexicon build --lock examples/synthetic.lock.json --out data/ci-b --distribution
      - run: diff -r data/ci-a data/ci-b
      - name: Validate committed synthetic output
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          a, b = Path('examples/output'), Path('data/ci-a')
          for p in a.glob('*.jsonl'):
              assert p.read_bytes() == (b/p.name).read_bytes(), p
          ma=json.loads((a/'manifest.json').read_text())
          mb=json.loads((b/'manifest.json').read_text())
          # Runtime version is recorded but may differ across the test matrix.
          ma.pop('python'); mb.pop('python')
          assert ma == mb
          PYCODE
