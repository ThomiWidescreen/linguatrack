name: Backend
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: linguatrack
          POSTGRES_USER: linguatrack
          POSTGRES_PASSWORD: local_admin
        ports: ['5433:5432']
        options: >-
          --health-cmd 'pg_isready -U linguatrack -d linguatrack'
          --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock && python -m pip install -e '.[dev]'
      - run: ruff check src tests migrations && ruff format --check src tests migrations
      - run: pytest -q
